[package]
name = "qday-receipts"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "A tiny QoreChain Native contract that keeps receipts. Called from EVM through the CrossVM bridge in Workshop 3."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
cosmwasm-std = "2.1"
cosmwasm-schema = "2.1"
cw-storage-plus = "2.0"
thiserror = "1"

[dev-dependencies]
cw-multi-test = "2.1"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true
